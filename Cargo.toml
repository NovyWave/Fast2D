[workspace]
resolver = "3"
members = [
    "crates/*"
]
exclude = ["examples/tauri_example/src-tauri", "examples/native_tao_example", "examples/blade_example"]

[workspace.package]
edition = "2024"

[patch.crates-io]
wgpu = { git = "https://github.com/gfx-rs/wgpu", tag = "v26.0.4" }
wgpu-core = { git = "https://github.com/gfx-rs/wgpu", tag = "v26.0.4", package = "wgpu-core" }
wgpu-hal = { git = "https://github.com/gfx-rs/wgpu", tag = "v26.0.4", package = "wgpu-hal" }
wgpu-types = { git = "https://github.com/gfx-rs/wgpu", tag = "v26.0.4", package = "wgpu-types" }
naga = { git = "https://github.com/gfx-rs/wgpu", tag = "v26.0.4", package = "naga" }
